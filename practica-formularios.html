<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Elegante y Responsivo</title>
  <link rel="stylesheet" href="./css/estilos_formularios.css">
</head>
<body>

  <div class="form-container">
    <h2>Formulario de Registro</h2>
    <form action="#" method="POST">
      
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="text" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="opciones">Categoría</label>
        <select id="opciones" name="opciones">
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="1">Opción 1</option>
          <option value="2">Opción 2</option>
          <option value="3">Opción 3</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Enviar</button>
        <button type="reset" class="btn btn-secondary">Cancelar</button>
      </div>

    </form>
  </div>

</body>
</html>
